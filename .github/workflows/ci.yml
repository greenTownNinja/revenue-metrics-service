name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Includes the drift guard: if a second revenue implementation has been
      # introduced anywhere outside src/revenue/, this step fails and names the
      # offending file. Tests run against PGlite (real Postgres, in-process), so
      # no service container or credentials are needed.
      - name: Test
        run: npm test
